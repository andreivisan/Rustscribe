name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.98.0"
  # Hosted Apple Silicon runners have less memory than a typical development Mac.
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test:
    name: macOS · API, CLI and desktop
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set up native dependencies
        run: |
          brew install cmake ffmpeg
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          ffmpeg -version
          ffprobe -version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST SDKROOT MACOSX_DEPLOYMENT_TARGET"

      - name: Lint API, CLI and desktop
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test API and CLI without desktop
        run: cargo test --locked --all-targets

      - name: Test with desktop enabled
        run: cargo test --locked --all-targets --all-features

      - name: Check documentation examples
        run: cargo test --locked --doc --all-features

      - name: Build both application binaries
        run: cargo build --locked --all-features --bins
