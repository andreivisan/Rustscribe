name: Release macOS

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  package:
    name: Build and verify Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          brew install cmake ffmpeg
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          bash scripts/install-release-tools.sh

      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$RELEASE_REF_TYPE" == tag && "$RELEASE_REF" != "v$version" ]]; then
            echo "Tag $RELEASE_REF does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Cache build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST SDKROOT MACOSX_DEPLOYMENT_TARGET"

      - name: Check source and tests before packaging
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Build, mount, and verify DMG
        run: bash scripts/package-macos.sh

      - name: Save verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rustscribe-macos-arm64-unsigned
          path: |
            target/releases/*.dmg
            target/releases/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish prerelease on version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" target/releases/*.dmg target/releases/*.dmg.sha256 \
            --verify-tag --prerelease --latest=false \
            --title "Rustscribe $RELEASE_TAG — macOS prerelease" \
            --notes-file packaging/macos/RELEASE-NOTES.md
