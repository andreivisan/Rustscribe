[package]
name = "rustscribe"
version = "0.1.0"
edition = "2024"
default-run = "rustscribe"
description = "Local video and audio transcription to Markdown, with a native macOS desktop app"
license = "MIT"
repository = "https://github.com/andreivisan/Rustscribe"

[features]
default = []
desktop = ["dep:gpui", "dep:log", "dep:serde", "dep:serde_json"]

[[bin]]
name = "rustscribe-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }
hound = "3.5.1"
log = { version = "0.4", optional = true }
tempfile = "3.27.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
transcribe-rs = { version = "=0.3.11", features = ["whisper-metal", "ort-coreml"] }
